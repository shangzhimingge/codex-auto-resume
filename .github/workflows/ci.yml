name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        node:
          - 22
          - 24
    env:
      PYTHONUTF8: "1"
      CODEX_AUTO_RESUME_PYTHON: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run Node.js tests, including packaged-tarball E2E
        run: node --test tests/node/launcher.test.mjs tests/node/package-e2e.test.mjs
      - name: Compile Python sources
        run: python -m compileall -q installer installer.py skill tests
      - name: Inspect the npm package
        run: npm pack --dry-run --json
